[build]
  publish = "dist/"
  command = "pnpm build || ( npm install pnpm && pnpm build )"

[build.environment]
  # pnpm 12 can't run through corepack yet, so Netlify installs this version directly.
  # Keep it in sync with devEngines.packageManager in package.json.
  PNPM_VERSION = "12.18.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.well-known/josh"
  [headers.values]
    Content-Type = "application/json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "pnpm dev"
  targetPort = 3333
